<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link href="/css/style.css" rel="stylesheet">
        <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0'>
        <link rel="shortcut icon" href="/images/favicon.png" type="image/webp">
        <link rel="apple-touch-icon" sizes="180x180" href="images/favicon.png">
        <link rel="icon" href="/images/favicon.png" type="image/webp">
        <title>Josh Landing</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Snowfall Background Animation -->
        <section class="animated-background">
            <div id="stars1"></div>
            <div id="stars2"></div>
            <div id="stars3"></div>
        </section>
        <!-- End of Snowfall Background Animation -->

        <div class="min-h-full flex-h-center" id="background_div">
            <input type="hidden" value="https://bio.link" id="app-url">
                <input type="hidden" value="null" id="is-featured">
                    <canvas id="bg-canvas" class="background-overlay"></canvas>
                </input>
            </input>

            <div class="mt-48 page-full-wrap relative">
                <input type="hidden" value="creator-page" id="page-type">
                <img class="display-image m-auto" data-src="/images/logo.png" src="/images/logo.png" alt="Landing logo"/>
                <h2 class="page-title page-text-color page-text-font mt-16 text-center">Josh Miller aka Ramen Junkie</h2>

                <div class="mt-24">
                        <div class="page-item-wrap relative">
                            <div class="page-item flex-both-center absolute"></div>
                            <a target="_blank" class="page-item-each py-10 flex-both-center" href="https://github.com/RamenJunkie" data-id="261685" data-type="page_item">
                                <img class="link-each-image" data-src="images/GitHub.png" src="images/GitHub.png" alt="GitHub"/>
                                <span class="item-title text-center">GitHub</span>
                            </a>
                        </div>                        
                        <div class="page-item-wrap relative">
                            <div class="page-item flex-both-center absolute"></div>
                            <a target="_blank" class="page-item-each py-10 flex-both-center" href="https://www.lameazoid.com/" data-id="261685" data-type="page_item">
                                <img class="link-each-image" data-src="images/Lameazoid.png" src="images/Instagram.png" alt="Lameazoid"/>
                                <span class="item-title text-center">Blog</span>
                            </a>
                        </div>                
                        <div class="page-item-wrap relative">
                            <div class="page-item flex-both-center absolute"></div>
                            <a target="_blank" class="page-item-each py-10 flex-both-center" href="https://bsky.app/profile/ramenjunkie.bsky.social" data-id="261685" data-type="page_item">
                                <img class="link-each-image" data-src="images/BlueSky.png" src="images/BlueSky.png" alt="Bluesky"/>
                                <span class="item-title text-center">BlueSky</span>
                            </a>
                        </div>  
                        <div class="page-item-wrap relative">
                            <div class="page-item flex-both-center absolute"></div>
                            <a target="_blank" class="page-item-each py-10 flex-both-center" href="https://retro.pizza/@ramenjunkie" data-id="261685" data-type="page_item">
                                <img class="link-each-image" data-src="images/Mastodon.png" src="images/Mastodon.png" alt="Mastodon"/>
                                <span class="item-title text-center">Mastodon</span>
                            </a>
                        </div>  
                        <div class="page-item-wrap relative">
                            <div class="page-item flex-both-center absolute"></div>
                            <a target="_blank" class="page-item-each py-10 flex-both-center" href="https://www.youtube.com/@RamenJunkie" data-id="261685" data-type="page_item">
                                <img class="link-each-image" data-src="images/YouTube.jpeg" src="images/YouTube.jpeg" alt="Youtube"/>
                                <span class="item-title text-center">Youtube</span>
                            </a>
                        </div>
                        </div>
            </div>
        </div>
    </body>

    <!-- A different snowfall -->
    <!-- <script src="/js/snowfall.js"></script> -->
</html>
